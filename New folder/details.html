<!DOCTYPE html>
<html lang="en">
<head>
    <title>Product Details</title>
    <style> body { font-family: Arial, sans-serif; text-align: center; } </style>
</head>
<body>
    <div style="margin-top: 50px;">
        <h1 id="product-name">Loading...</h1>
        <h3>Category: <span id="product-category"></span></h3>
        <h3>Price: <span id="product-price"></span></h3>
        <br>
        <a href="products.html">Back to Products</a>
    </div>

    <script>
        const products = [
            { id: 1, name: "Smart Watch", category: "Electronics", price: "₹2999" },
            { id: 2, name: "Wireless Earbuds", category: "Accessories", price: "₹1999" },
            { id: 3, name: "Gaming Mouse", category: "Gaming", price: "₹1499" },
            { id: 4, name: "Bluetooth Speaker", category: "Audio", price: "₹2499" }
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        const product = products.find(p => p.id == productId);

        if (product) {
            document.getElementById('product-name').innerText = product.name;
            document.getElementById('product-category').innerText = product.category;
            document.getElementById('product-price').innerText = product.price;
        } else {
            document.getElementById('product-name').innerText = "Product Not Found";
        }
    </script>
</body>
</html>
